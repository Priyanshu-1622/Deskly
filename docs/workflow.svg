<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
<title id="title">From your task to a reviewed deliverable</title><desc id="desc">Assign a task, let the employee work in its project folder, review requested changes, then inspect the result. Animation illustrates the sequence, not measured speed.</desc>
<style>.pulse{animation:pass 8s ease infinite}.p2{animation-delay:2s}.p3{animation-delay:4s}.p4{animation-delay:6s}@keyframes pass{0%,25%,100%{opacity:.15}8%,18%{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.7}}</style>
<rect width="960" height="240" rx="12" fill="#111417"/><path d="M0 0H960" stroke="#f2c230" stroke-width="6"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="40" fill="#f4efe3" font-size="20" font-weight="700">YOU LEAD. YOUR TEAM BUILDS.</text><text x="28" y="64" fill="#a5aaa6" font-size="13">A reviewed project workflow · illustrated sequence</text>
<path d="M130 135H825" stroke="#59634e" stroke-width="2" stroke-dasharray="5 7"/>
<g fill="#1b2225" stroke="#46524a"><rect x="28" y="90" width="205" height="115" rx="6"/><rect x="261" y="90" width="205" height="115" rx="6"/><rect x="494" y="90" width="205" height="115" rx="6"/><rect x="727" y="90" width="205" height="115" rx="6"/></g>
<g fill="none" stroke="#f2c230" stroke-width="2"><rect class="pulse" x="28" y="90" width="205" height="115" rx="6"/><rect class="pulse p2" x="261" y="90" width="205" height="115" rx="6"/><rect class="pulse p3" x="494" y="90" width="205" height="115" rx="6"/><rect class="pulse p4" x="727" y="90" width="205" height="115" rx="6"/></g>
<g fill="#f2c230" font-size="12" font-weight="700"><text x="46" y="116">01 / ASSIGN</text><text x="279" y="116">02 / BUILD</text><text x="512" y="116">03 / REVIEW</text><text x="745" y="116">04 / INSPECT</text></g>
<g fill="#f4efe3" font-size="18" font-weight="600"><text x="46" y="148">Give a clear task</text><text x="279" y="148">Work in role folders</text><text x="512" y="148">Approve changes</text><text x="745" y="148">Open the result</text></g>
<g fill="#a5aaa6" font-size="12"><text x="46" y="176">Your project. Your instructions.</text><text x="279" y="176">frontend/ · backend/ · docs/</text><text x="512" y="176">Read files and commands first.</text><text x="745" y="176">Verify before using or shipping.</text></g></g></svg>
